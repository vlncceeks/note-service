# III: all configuration comes from environment variables
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/notes}
spring.datasource.username=${DB_USER:notes}
spring.datasource.password=${DB_PASSWORD:notes}

# The schema is managed by Liquibase; Hibernate only validates it
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# IX: graceful shutdown (wait for in-flight requests)
server.shutdown=graceful

# XI: logs go to stdout only (no log files, no rotation); levels are set via environment
logging.level.root=${LOG_LEVEL:INFO}
logging.level.app=${APP_LOG_LEVEL:INFO}
