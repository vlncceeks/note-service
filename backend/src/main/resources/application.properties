# III: вся конфигурация - из переменных окружения
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/notes}
spring.datasource.username=${DB_USER:notes}
spring.datasource.password=${DB_PASSWORD:notes}

# Схемой управляет Liquibase, Hibernate только проверяет соответствие
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# IX: корректная остановка (дожидаемся текущих запросов)
server.shutdown=graceful

# XI: логи пишем только в stdout (файлов и ротации нет), уровни - через окружение
logging.level.root=${LOG_LEVEL:INFO}
logging.level.app=${APP_LOG_LEVEL:INFO}
