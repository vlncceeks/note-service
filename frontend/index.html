<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Notes</title>
<style>
  body { font-family: sans-serif; max-width: 600px; margin: 2rem auto; }
  input, textarea, button { display: block; margin: .4rem 0; width: 100%; box-sizing: border-box; padding: .4rem; }
  button { width: auto; display: inline-block; }
  .note { border: 1px solid #ccc; padding: .5rem; margin: .5rem 0; }
  .hidden { display: none; }
</style>
</head>
<body>
<h1>Notes</h1>

<div id="auth">
  <input id="u" placeholder="логин">
  <input id="p" type="password" placeholder="пароль">
  <button onclick="login()">Войти</button>
  <button onclick="register()">Регистрация</button>
  <p id="err" style="color:red"></p>
</div>

<div id="app" class="hidden">
  <p>Вы: <b id="me"></b> <button onclick="logout()">Выйти</button></p>
  <input id="title" placeholder="Заголовок">
  <textarea id="content" placeholder="Текст"></textarea>
  <button id="save" onclick="save()">Добавить</button>
  <button onclick="resetForm()">Отмена</button>
  <div id="list"></div>
</div>

<script>
let auth = sessionStorage.getItem('auth');
let editId = null;
const $ = id => document.getElementById(id);

async function api(method, url, body, noAuth) {
  const headers = { 'Content-Type': 'application/json' };
  if (auth && !noAuth) headers.Authorization = auth;
  const r = await fetch(url, { method, headers, body: body ? JSON.stringify(body) : undefined });
  if (r.status === 401) { logout(); throw new Error('unauthorized'); }
  if (!r.ok) throw new Error(r.status);
  return r.status === 204 ? null : r.json();
}

async function register() {
  try {
    await api('POST', '/api/auth/register', { username: $('u').value, password: $('p').value }, true);
    await login();
  } catch (e) { $('err').textContent = 'Ошибка регистрации: ' + e.message; }
}

async function login() {
  auth = 'Basic ' + btoa(unescape(encodeURIComponent($('u').value + ':' + $('p').value)));
  try {
    const me = await api('GET', '/api/auth/me');
    sessionStorage.setItem('auth', auth);
    start(me.username);
  } catch (e) { auth = null; $('err').textContent = 'Неверный логин или пароль'; }
}

function logout() {
  auth = null; sessionStorage.removeItem('auth');
  $('app').classList.add('hidden'); $('auth').classList.remove('hidden');
}

async function start(name) {
  $('me').textContent = name || '';
  $('auth').classList.add('hidden'); $('app').classList.remove('hidden');
  $('err').textContent = '';
  load();
}

async function load() {
  const notes = await api('GET', '/api/notes');
  $('list').innerHTML = '';
  for (const n of notes) {
    const d = document.createElement('div');
    d.className = 'note';
    const h = document.createElement('b'); h.textContent = n.title;
    const p = document.createElement('p'); p.textContent = n.content;
    const e = document.createElement('button'); e.textContent = 'Изменить';
    e.onclick = () => { editId = n.id; $('title').value = n.title; $('content').value = n.content; $('save').textContent = 'Сохранить'; };
    const x = document.createElement('button'); x.textContent = 'Удалить';
    x.onclick = async () => { await api('DELETE', '/api/notes/' + n.id); load(); };
    d.append(h, p, e, x);
    $('list').append(d);
  }
}

async function save() {
  const body = { title: $('title').value, content: $('content').value };
  if (editId) await api('PUT', '/api/notes/' + editId, body);
  else await api('POST', '/api/notes', body);
  resetForm(); load();
}

function resetForm() {
  editId = null; $('title').value = ''; $('content').value = ''; $('save').textContent = 'Добавить';
}

if (auth) api('GET', '/api/auth/me').then(m => start(m.username)).catch(() => {});
</script>
</body>
</html>
