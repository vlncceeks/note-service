apiVersion: apps/v1
kind: Deployment
metadata:
  name: note-service-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: note-service-frontend
  template:
    metadata:
      labels:
        app: note-service-frontend
    spec:
      containers:
        - name: note-service-frontend
          image: note-service-frontend:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          env:
            - name: BACKEND_URL
              value: http://note-service-backend:8080
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
