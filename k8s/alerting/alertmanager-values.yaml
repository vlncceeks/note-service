alertmanager:
  enabled: true

  config:
    global:
      resolve_timeout: 5m
      smtp_smarthost: 'smtp.yandex.ru:587'
      smtp_from: 'lbtdmamonova@yandex.ru'
      smtp_auth_username: 'lbtdmamonova@yandex.ru'
      smtp_auth_password_file: /etc/alertmanager/secrets/smtp-password
      smtp_require_tls: true

    route:
      receiver: email
      group_by:
        - component
        - alertname
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h

    receivers:
      - name: email
        email_configs:
          - to: 'alertmanager_receiver@mail.ru'
            send_resolved: true

  extraVolumes:
    - name: smtp-credentials
      secret:
        secretName: alertmanager-smtp

  extraVolumeMounts:
    - name: smtp-credentials
      mountPath: /etc/alertmanager/secrets
      readOnly: true
